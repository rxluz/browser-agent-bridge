name: Feature request
description: Propose a site-agnostic improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer workflow cannot be completed today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the general browser-platform behavior, not a workaround for one website.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Explain any new page access, permissions, or commands the feature would require.
    validations:
      required: true
