<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; width: 260px; padding: 12px; margin: 0; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .status { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 12px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #a00; }
      .dot.on { background: #0a7d33; }
      label { display: block; font-size: 12px; color: #555; margin: 8px 0 2px; }
      input { width: 100%; box-sizing: border-box; padding: 5px 6px; font-size: 13px; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button { flex: 1; padding: 6px; font-size: 13px; cursor: pointer; }
      .error { color: #a00; font-size: 12px; margin: 6px 0 0; min-height: 1em; }
    </style>
  </head>
  <body>
    <h1>Browser Agent Bridge</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="statusText">Checking…</span></div>

    <label for="host">Host</label>
    <input id="host" type="text" />
    <label for="port">Port</label>
    <input id="port" type="number" />
    <label for="token">Bridge token</label>
    <input id="token" type="password" autocomplete="off" minlength="32" />
    <p id="error" class="error" role="alert"></p>

    <div class="row">
      <button id="save">Save &amp; connect</button>
      <button id="reconnect">Reconnect</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
